        cd linux-expsync/protocol && make SCANNER_TOOL=wayland-scanner && cd ../..
        cd protocol && make SCANNER_TOOL=wayland-scanner && cd ..

    - name: Build and install linux-dmabuf library first
      run: |
        autoreconf -fi
        ./configure \
          --prefix=/usr/local \
          --enable-ldbprotocol \
          --disable-embedded \
          --enable-xdgstable \
          CXXFLAGS="-I/usr/include/libdrm"
        # Build only the linux-dmabuf library target
        make -j$(nproc) libwesteros_linux_dmabuf_server.la
        # Install the library and its headers
        sudo mkdir -p /usr/local/lib /usr/local/include
        sudo cp .libs/libwesteros_linux_dmabuf_server.so* /usr/local/lib/ 2>/dev/null || true
        sudo cp libwesteros_linux_dmabuf_server.la /usr/local/lib/
        sudo cp linux-dmabuf/westeros-linux-dmabuf.h /usr/local/include/
        sudo cp linux-dmabuf/protocol/linux-dmabuf-unstable-v1-server-protocol.h /usr/local/include/
        sudo ldconfig

    - name: Configure main project
      run: |
        ./configure \
          --prefix=/usr/local \
          --enable-app \
          --enable-test \
          --enable-player \
          --enable-rendergl \
          --enable-ldbprotocol \
          --enable-lexpsyncprotocol \
          --disable-embedded \
          --enable-xdgstable \
          CXXFLAGS="-I/usr/include/libdrm"

    - name: Build main project
      run: |
        make -j$(nproc)
        sudo make install
        sudo ldconfig

    - name: Verify Build Success
      if: success() && !env.ACT
      run: |
        echo "Build completed successfully"
        TOTAL_SOURCE_FILES=$(find . -name "*.cpp" -o -name "*.c" | grep -v "test/" | grep -v ".libs/" | wc -l)
        echo "Total C/C++ source files built: $TOTAL_SOURCE_FILES"

    - name: Generate build summary
      if: always()
      run: |
        mkdir -p build-report
        TOTAL_FILES=$(find . -name "*.cpp" -o -name "*.c" | grep -v "test/" | grep -v ".libs/" | wc -l)
        
        cat > build-report/summary.md << EOF
        # Build Summary
        
        **Build Date:** $(date)
        **Commit:** $(git rev-parse --short HEAD)
        **Branch:** $(git rev-parse --abbrev-ref HEAD)
        
        ## Build Configuration
        - **Enabled features:** app, test, player, rendergl, ldbprotocol, lexpsyncprotocol, xdgstable
        - **Disabled features:** embedded
        - **Total C/C++ source files:** $TOTAL_FILES
        
        ## Components Built
        - westeros-compositor.cpp
        - westeros-nested.cpp  
        - westeros-render.cpp
        - westeros-render-gl.cpp
        - westeros-render-embedded.cpp
        - westeros-main.cpp
        - westeros-player.cpp
        - linux-dmabuf/westeros-linux-dmabuf.cpp (separate library)
        - linux-expsync/westeros-linux-expsync.cpp (into compositor)
        
        ## Build Status
        ✅ Build completed successfully
        EOF
        
        echo "## Source Files" >> build-report/summary.md
        find . -name "*.cpp" -o -name "*.c" | grep -v test | grep -v .libs | head -50 >> build-report/summary.md || true

    - name: Upload build report
      if: always() && !env.ACT
      uses: actions/upload-artifact@v4
      with:
        name: build-report
        path: build-report/
        retention-days: 30


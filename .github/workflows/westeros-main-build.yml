name: Build Westeros

on:
  push:
    branches: [ * ]  # Run on main branches only
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        chmod +x scripts/install-dependencies.sh
        ./scripts/install-dependencies.sh

    - name: Build all components
      run: |
        chmod +x scripts/build-components.sh
        ./scripts/build-components.sh

    - name: Generate build artifacts list
      if: always()
      run: |
        echo "Collecting build artifacts..."
        mkdir -p artifacts
        # Copy built binaries
        if [ -f westeros ]; then cp westeros artifacts/ || true; fi
        if [ -f westeros_test ]; then cp westeros_test artifacts/ || true; fi
        if [ -f westeros_player ]; then cp westeros_player artifacts/ || true; fi
        # Copy libraries
        find .libs -name "*.so*" -type f -exec cp {} artifacts/ \; 2>/dev/null || true
        find . -name "*.la" -type f -exec cp {} artifacts/ \; 2>/dev/null || true
        # Generate build summary
        cat > artifacts/build-summary.txt << EOF
        Build Date: $(date)
        Compiler: $(gcc --version | head -n1)
        Build Configuration: All features enabled
        Libraries Built:
        $(ls -la .libs/*.so* 2>/dev/null || echo "No shared libraries found")
        EOF
        ls -la artifacts/

  build-coverity:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        chmod +x scripts/install-dependencies.sh
        # Retry apt-get update up to 3 times to handle mirror sync issues
        for i in 1 2 3; do
          sudo apt-get update && break || {
            echo "apt-get update failed, attempt $i/3"
            [ $i -lt 3 ] && sleep 10 || exit 1
          }
        done
        # Install extra packages needed for coverity
        sudo apt-get install -y curl wget
        ./scripts/install-dependencies.sh

    - name: Build all components
      run: |
        chmod +x scripts/build-components.sh
        ./scripts/build-components.sh

    - name: Verify Build Success
      if: success() && !env.ACT
      run: |
        echo "Build completed successfully"
        TOTAL_SOURCE_FILES=$(find . -name "*.cpp" -o -name "*.c" | grep -v "test/" | grep -v ".libs/" | wc -l)
        echo "Total C/C++ source files built: $TOTAL_SOURCE_FILES"

    - name: Generate build summary
      if: always()
      run: |
        mkdir -p build-report
        TOTAL_FILES=$(find . -name "*.cpp" -o -name "*.c" | grep -v "test/" | grep -v ".libs/" | wc -l)
        
        cat > build-report/summary.md << EOF
        # Build Summary
        
        **Build Date:** $(date)
        **Commit:** $(git rev-parse --short HEAD)
        **Branch:** $(git rev-parse --abbrev-ref HEAD)
        
        ## Build Configuration
        - **Enabled features:** app, test, player, rendergl, ldbprotocol, lexpsyncprotocol, xdgstable
        - **Disabled features:** embedded
        - **Total C/C++ source files:** $TOTAL_FILES
        
        ## Components Built
        - westeros-compositor.cpp
        - westeros-nested.cpp  
        - westeros-render.cpp
        - westeros-render-gl.cpp
        - westeros-render-embedded.cpp
        - westeros-main.cpp
        - westeros-player.cpp
        - linux-dmabuf/westeros-linux-dmabuf.cpp (separate library)
        - linux-expsync/westeros-linux-expsync.cpp (into compositor)
        
        ## Build Status
        ✅ Build completed successfully
        EOF
        
        echo "## Source Files" >> build-report/summary.md
        find . -name "*.cpp" -o -name "*.c" | grep -v test | grep -v .libs | head -50 >> build-report/summary.md || true

    - name: Upload build report
      if: always() && !env.ACT
      uses: actions/upload-artifact@v4
      with:
        name: build-report
        path: build-report/
        retention-days: 30

  build-ubuntu-autotools:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        chmod +x scripts/install-dependencies.sh
        ./scripts/install-dependencies.sh

    - name: Build all components
      run: |
        chmod +x scripts/build-components.sh
        ./scripts/build-components.sh


name: Build and Test with Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        build_type: [Debug, Release]
        coverage: [ON, OFF]
        exclude:
          # Only enable coverage for Debug builds
          - build_type: Release
            coverage: ON
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          libegl1-mesa-dev \
          libgles2-mesa-dev \
          libgbm-dev \
          libdrm-dev \
          libgtest-dev \
          libgmock-dev \
          lcov \
          gcovr
    
    - name: Display Build Configuration
      run: |
        echo "=========================================="
        echo "L1 Test Suite for Westeros - CI Build"
        echo "=========================================="
        echo "Build Type: ${{ matrix.build_type }}"
        echo "Coverage: ${{ matrix.coverage }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "=========================================="
    
    - name: Verify Source Structure
      run: |
        echo "Verifying source structure..."
        if [ ! -f "westeros-compositor.cpp" ]; then
          echo "ERROR: westeros-compositor.cpp not found!"
          exit 1
        fi
        echo "✓ Source structure verified"
        ls -la
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_COVERAGE=${{ matrix.coverage }} \
          -DWESTEROS_MAIN_SRC_ROOT="${GITHUB_WORKSPACE}" \
          -DSIMPLESHELL_SRC_ROOT="${GITHUB_WORKSPACE}/simpleshell" \
          -DLINUX_DMABUF_SRC_ROOT="${GITHUB_WORKSPACE}/linux-dmabuf" \
          -DLINUX_EXPSYNC_SRC_ROOT="${GITHUB_WORKSPACE}/linux-expsync" \
          -DBUILD_SIMPLESHELL_TESTS=ON \
          -DBUILD_LINUX_DMABUF_TESTS=ON \
          -DBUILD_LINUX_EXPSYNC_TESTS=ON
    
    - name: Build
      run: |
        cd build
        cmake --build . \
          --config ${{ matrix.build_type }} \
          --parallel $(nproc) \
          --verbose
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --verbose
      continue-on-error: false
    
    - name: Generate Coverage Report (Debug with Coverage only)
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      run: |
        cd build
        echo "=========================================="
        echo "Generating Coverage Report..."
        echo "=========================================="
        cmake --build . --target coverage
        echo ""
        echo "Coverage report generated successfully!"
    
    - name: Display Coverage Summary
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      run: |
        cd build
        if [ -f "coverage.info" ]; then
          echo "=========================================="
          echo "Coverage Summary:"
          echo "=========================================="
          lcov --list coverage.info
          echo "=========================================="
        fi
    
    - name: Upload Coverage HTML Report
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-html
        path: build/coverage_html/
        retention-days: 30
    
    - name: Upload Coverage Info File
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-info
        path: build/coverage.info
        retention-days: 30
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.build_type }}-coverage-${{ matrix.coverage }}
        path: |
          build/Testing/
          build/**/*.xml
        retention-days: 14
        if-no-files-found: ignore
    
    - name: Generate Coverage Badge Data
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      run: |
        cd build
        if [ -f "coverage.info" ]; then
          # Extract coverage percentage
          COVERAGE=$(lcov --summary coverage.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "Total Coverage: ${COVERAGE}%"
          echo "COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV
          
          # Create badge JSON
          mkdir -p badge
          cat > badge/coverage.json << EOF
        {
          "schemaVersion": 1,
          "label": "coverage",
          "message": "${COVERAGE}%",
          "color": "$(if (( $(echo "$COVERAGE >= 70" | bc -l) )); then echo 'green'; elif (( $(echo "$COVERAGE >= 50" | bc -l) )); then echo 'yellow'; else echo 'red'; fi)"
        }
        EOF
          cat badge/coverage.json
        fi
    
    - name: Upload Coverage Badge
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: build/badge/
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Comment Coverage on PR
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverageFile = 'build/coverage.info';
          
          if (fs.existsSync(coverageFile)) {
            const { execSync } = require('child_process');
            const summary = execSync('lcov --summary build/coverage.info 2>&1').toString();
            
            const comment = `## Coverage Report\n\n\`\`\`\n${summary}\n\`\`\`\n\n📊 Full coverage report available in artifacts.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
    
    - name: Build Summary
      if: always()
      run: |
        echo "=========================================="
        echo "Build Summary"
        echo "=========================================="
        echo "Build Type: ${{ matrix.build_type }}"
        echo "Coverage Enabled: ${{ matrix.coverage }}"
        echo "Status: ${{ job.status }}"
        echo "=========================================="


name: L1 Test Suite - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        build_type: [Debug, Release]
        coverage: [ON, OFF]
        exclude:
          # Only enable coverage for Debug builds
          - build_type: Release
            coverage: ON
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          libegl1-mesa-dev \
          libgles2-mesa-dev \
          libgbm-dev \
          libdrm-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libgtest-dev \
          libgmock-dev \
          lcov \
          gcovr
        
        # Verify critical dependencies
        echo "Verifying xkbcommon installation..."
        if ! pkg-config --exists xkbcommon; then
          echo "ERROR: xkbcommon not found via pkg-config"
          exit 1
        fi
        if ! find /usr/include -name "xkbcommon.h" 2>/dev/null | grep -q .; then
          echo "ERROR: xkbcommon.h header not found"
          exit 1
        fi
        echo "✓ xkbcommon verified"
        
        # Display package info
        pkg-config --modversion xkbcommon
        pkg-config --cflags xkbcommon
        pkg-config --libs xkbcommon
    
    - name: Display Build Configuration
      run: |
        echo "=========================================="
        echo "L1 Test Suite for Westeros - CI Build"
        echo "=========================================="
        echo "Build Type: ${{ matrix.build_type }}"
        echo "Coverage: ${{ matrix.coverage }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "=========================================="
    
    - name: Verify Source Structure
      run: |
        echo "Verifying source structure..."
        if [ ! -f "westeros-compositor.cpp" ]; then
          echo "ERROR: westeros-compositor.cpp not found!"
          exit 1
        fi
        if [ ! -f "build.sh" ]; then
          echo "ERROR: build.sh not found!"
          exit 1
        fi
        echo "✓ Source structure verified"
        chmod +x build.sh
        ls -la
    
    - name: Build Using build.sh
      env:
        PKG_CONFIG_PATH: /usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
      run: |
        # Verify xkbcommon is accessible
        echo "Checking xkbcommon accessibility..."
        pkg-config --exists xkbcommon || (echo "ERROR: xkbcommon not found during build" && exit 1)
        
        # Run build
        if [ "${{ matrix.coverage }}" = "ON" ]; then
          ./build.sh --coverage --jobs $(nproc)
        else
          if [ "${{ matrix.build_type }}" = "Release" ]; then
            ./build.sh --release --jobs $(nproc)
          else
            ./build.sh --jobs $(nproc)
          fi
        fi
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --verbose
      continue-on-error: false
    
    - name: Generate Coverage Report (Debug with Coverage only)
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      run: |
        echo "=========================================="
        echo "Coverage report already generated by build.sh"
        echo "=========================================="
        if [ -d "build/coverage_html" ]; then
          echo "✓ Coverage HTML directory found"
          ls -la build/coverage_html/
          echo ""
          echo "Coverage report files:"
          find build/coverage_html -type f -name "*.html" | head -10
        else
          echo "✗ Coverage HTML directory not found"
          exit 1
        fi
    
    - name: Display Coverage Summary
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      run: |
        cd build
        if [ -f "coverage.info" ]; then
          echo "=========================================="
          echo "Coverage Summary:"
          echo "=========================================="
          lcov --list coverage.info | tee coverage_summary.txt
          echo "=========================================="
          echo ""
          echo "📊 Coverage HTML Report will be available in artifacts"
          echo "   Download 'coverage-report-html' artifact and open index.html"
        fi
    
    - name: Upload Coverage HTML Report
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-html
        path: build/coverage_html/
        retention-days: 30
    
    - name: Upload Coverage Summary
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-summary
        path: build/coverage_summary.txt
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Upload Coverage Info File
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-info
        path: build/coverage.info
        retention-days: 30
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.build_type }}-coverage-${{ matrix.coverage }}
        path: |
          build/Testing/
          build/**/*.xml
        retention-days: 14
        if-no-files-found: ignore
    
    - name: Generate Coverage Badge Data
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      run: |
        cd build
        if [ -f "coverage.info" ]; then
          # Extract coverage percentage
          COVERAGE=$(lcov --summary coverage.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "Total Coverage: ${COVERAGE}%"
          echo "COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV
          
          # Create badge JSON
          mkdir -p badge
          cat > badge/coverage.json << EOF
        {
          "schemaVersion": 1,
          "label": "coverage",
          "message": "${COVERAGE}%",
          "color": "$(if (( $(echo "$COVERAGE >= 70" | bc -l) )); then echo 'green'; elif (( $(echo "$COVERAGE >= 50" | bc -l) )); then echo 'yellow'; else echo 'red'; fi)"
        }
        EOF
          cat badge/coverage.json
        fi
    
    - name: Upload Coverage Badge
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: build/badge/
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Comment Coverage on PR
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverageFile = 'build/coverage.info';
          
          if (fs.existsSync(coverageFile)) {
            const { execSync } = require('child_process');
            const summary = execSync('lcov --summary build/coverage.info 2>&1').toString();
            
            const comment = `## Coverage Report\n\n\`\`\`\n${summary}\n\`\`\`\n\n📊 Full coverage report available in artifacts.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
    
    - name: Build Summary
      if: always()
      run: |
        echo "=========================================="
        echo "Build Summary"
        echo "=========================================="
        echo "Build Type: ${{ matrix.build_type }}"
        echo "Coverage Enabled: ${{ matrix.coverage }}"
        echo "Status: ${{ job.status }}"
        if [ "${{ matrix.coverage }}" = "ON" ] && [ "${{ matrix.build_type }}" = "Debug" ]; then
          echo ""
          echo "📊 Coverage artifacts uploaded:"
          echo "   • coverage-report-html - Full HTML coverage report"
          echo "   • coverage-summary - Text summary of coverage"
          echo "   • coverage-info - LCOV info file"
          echo "   • coverage-badge - Badge JSON data"
          echo ""
          echo "To view the coverage report:"
          echo "   1. Download 'coverage-report-html' artifact"
          echo "   2. Extract the zip file"
          echo "   3. Open index.html in your browser"
        fi
        echo "=========================================="

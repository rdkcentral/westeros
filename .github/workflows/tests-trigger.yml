name: tests-trigger

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string
  push:
    branches: [main, develop, 'sprint/**', 'release/**']
  pull_request:
    branches: [main, develop, 'sprint/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  westeros-build:
    name: Build Westeros
    uses: ./.github/workflows/westeros-main-build.yml
    with:
      caller_source: local

  l1-tests:
    name: L1 tests (Westeros)
    uses: ./.github/workflows/L1-tests.yml
    with:
      caller_source: local

  # L2 is intentionally not invoked until its workflow is ready.